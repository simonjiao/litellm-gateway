[project]
name = "litellm-codex-gateway"
version = "0.3.0"
description = "Codex app-server and MCP Apps adapter for a LiteLLM Python Responses gateway"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.33,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "docker>=7.1,<8.0",
  "httpx>=0.28,<1.0",
  "litellm[proxy]==1.99.0rc1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10.0",
  "pytest-asyncio>=1.0,<2.0",
  "ruff>=0.15,<1.0",
  "basedpyright>=1.39,<2.0",
]

[project.scripts]
codex-responses-adapter = "codex_responses_adapter.cli:main"
sandbox-manager = "sandbox_manager.cli:main"
sandbox-worker = "sandbox_worker.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/codex_responses_adapter",
  "src/sandbox_api",
  "src/sandbox_manager",
  "src/sandbox_worker",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = [".venv"]
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
