name: agent

x-common-runtime: &common-runtime
  runtime: runc
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m

services:
  open-webui:
    <<: *common-runtime
    build:
      context: .
      dockerfile: deploy/open-webui/Dockerfile
    image: ${AGENT_OPEN_WEBUI_IMAGE:-agent-open-webui:0.3.0}
    restart: "no"
    environment:
      OPENAI_API_BASE_URL: http://gateway:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_CONFIGS: '{"0":{"api_type":"responses"}}'
      DEFAULT_MODELS: codex-terra
      ENABLE_OLLAMA_API: "false"
      ENABLE_SIGNUP: "false"
      ENABLE_RESPONSES_API_STATEFUL: "true"
      DEFAULT_MODEL_METADATA: '{"capabilities":{"builtin_tools":false}}'
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:?set OPEN_WEBUI_SECRET_KEY}
      UVICORN_WORKERS: "1"
      AGENT_WORKSPACE_ENABLED: ${AGENT_WORKSPACE_ENABLED:-false}
      AGENT_ADAPTER_BASE_URL: http://adapter:8090
      AGENT_ADAPTER_API_KEY: ${CODEX_ADAPTER_API_KEY:?set CODEX_ADAPTER_API_KEY}
      AGENT_OPERATION_SIGNING_SECRET: ${SANDBOX_MANAGER_OPERATION_SIGNING_SECRET:?set SANDBOX_MANAGER_OPERATION_SIGNING_SECRET}
      AGENT_ARTIFACT_BASE_URL: http://artifact-service:8093
      AGENT_ARTIFACT_API_KEY: ${ARTIFACT_SERVICE_API_KEY:?set ARTIFACT_SERVICE_API_KEY}
      AGENT_GRANT_TTL_SECONDS: ${AGENT_GRANT_TTL_SECONDS:-120}
      AGENT_TERMINAL_GRANT_TTL_SECONDS: ${AGENT_TERMINAL_GRANT_TTL_SECONDS:-7200}
      AGENT_MAX_FILE_BYTES: ${AGENT_MAX_FILE_BYTES:-1073741824}
      AGENT_PUBLISH_RECONCILE_SECONDS: ${AGENT_PUBLISH_RECONCILE_SECONDS:-15}
      AGENT_PUBLISH_RETRY_LIMIT: ${AGENT_PUBLISH_RETRY_LIMIT:-8}
      STORAGE_PROVIDER: ${OPEN_WEBUI_STORAGE_PROVIDER:-local}
      S3_ENDPOINT_URL: ${RUSTFS_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${OPEN_WEBUI_S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${OPEN_WEBUI_S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${OPEN_WEBUI_S3_BUCKET:-agent-data}
      S3_KEY_PREFIX: ${OPEN_WEBUI_S3_KEY_PREFIX:-open-webui/files}
      S3_REGION_NAME: ${RUSTFS_REGION:-us-east-1}
      S3_ADDRESSING_STYLE: path
    ports:
      - ${OPEN_WEBUI_PORT:-3000}:8080
    volumes:
      - open-webui-data:/app/backend/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      gateway:
        condition: service_healthy
      artifact-service:
        condition: service_healthy
    networks:
      - control
      - storage

  artifact-service:
    <<: *common-runtime
    build:
      context: .
      dockerfile: deploy/artifact-service/Dockerfile
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: ${AGENT_ARTIFACT_SERVICE_IMAGE:-agent-artifact-service:0.3.0}
    restart: unless-stopped
    environment:
      ARTIFACT_SERVICE_HOST: 0.0.0.0
      ARTIFACT_SERVICE_PORT: "8093"
      ARTIFACT_SERVICE_API_KEY: ${ARTIFACT_SERVICE_API_KEY:?set ARTIFACT_SERVICE_API_KEY}
      ARTIFACT_SERVICE_CAPABILITY_SECRET: ${ARTIFACT_SERVICE_CAPABILITY_SECRET:?set ARTIFACT_SERVICE_CAPABILITY_SECRET}
      ARTIFACT_SERVICE_CAPABILITY_TTL_SECONDS: ${ARTIFACT_SERVICE_CAPABILITY_TTL_SECONDS:-300}
      ARTIFACT_SERVICE_MAX_FILE_BYTES: ${AGENT_MAX_FILE_BYTES:-1073741824}
      ARTIFACT_SERVICE_S3_ENDPOINT_URL: ${RUSTFS_ENDPOINT:?set RUSTFS_ENDPOINT}
      ARTIFACT_SERVICE_S3_REGION: ${RUSTFS_REGION:-us-east-1}
      ARTIFACT_SERVICE_S3_ACCESS_KEY_ID: ${ARTIFACT_S3_ACCESS_KEY_ID:?set ARTIFACT_S3_ACCESS_KEY_ID}
      ARTIFACT_SERVICE_S3_SECRET_ACCESS_KEY: ${ARTIFACT_S3_SECRET_ACCESS_KEY:?set ARTIFACT_S3_SECRET_ACCESS_KEY}
      ARTIFACT_SERVICE_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-agent-data}
      ARTIFACT_SERVICE_S3_PREFIX: ${ARTIFACT_S3_PREFIX:-artifacts}
      ARTIFACT_SERVICE_TRANSFER_BASE_URL: http://artifact-service:8093
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/healthz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - control
      - storage

  gateway:
    <<: *common-runtime
    build:
      context: .
      dockerfile: deploy/gateway/Dockerfile
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        LITELLM_INDEX_URL: ${LITELLM_INDEX_URL:-https://pypi.org/simple}
    image: ${AGENT_GATEWAY_IMAGE:-agent-gateway:0.3.0}
    restart: "no"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      CODEX_ADAPTER_BASE_URL: http://adapter:8090/v1
      CODEX_ADAPTER_API_KEY: ${CODEX_ADAPTER_API_KEY:?set CODEX_ADAPTER_API_KEY}
    ports:
      - ${LITELLM_PORT:-4000}:4000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1', 4000), 2).close()
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      adapter:
        condition: service_healthy
    networks:
      - control

  adapter:
    <<: *common-runtime
    build:
      context: .
      dockerfile: deploy/responses-adapter/Dockerfile
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: ${AGENT_ADAPTER_IMAGE:-agent-adapter:0.3.0}
    restart: "no"
    environment:
      CODEX_ADAPTER_HOST: 0.0.0.0
      CODEX_ADAPTER_PORT: "8090"
      CODEX_ADAPTER_API_KEY: ${CODEX_ADAPTER_API_KEY:?set CODEX_ADAPTER_API_KEY}
      CODEX_ADAPTER_SANDBOX_MANAGER_BASE_URL: http://sandbox-manager:8092
      CODEX_ADAPTER_SANDBOX_MANAGER_API_KEY: ${SANDBOX_MANAGER_API_KEY:?set SANDBOX_MANAGER_API_KEY}
      CODEX_ADAPTER_AGENT_WORKSPACE: ${CODEX_ADAPTER_AGENT_WORKSPACE:-/workspace/work}
      CODEX_ADAPTER_PUBLISH_CALLBACK_URL: http://open-webui:8080/api/agent/events/response-terminal
      CODEX_ADAPTER_CODEX_MODEL: ${CODEX_ADAPTER_CODEX_MODEL:-}
      CODEX_ADAPTER_CODEX_EPHEMERAL_THREADS: ${CODEX_ADAPTER_CODEX_EPHEMERAL_THREADS:-false}
      CODEX_ADAPTER_REQUEST_TIMEOUT_SECONDS: ${CODEX_ADAPTER_REQUEST_TIMEOUT_SECONDS:-3600}
      CODEX_ADAPTER_MAX_CONCURRENT_EXECUTIONS: ${CODEX_ADAPTER_MAX_CONCURRENT_EXECUTIONS:-8}
      CODEX_ADAPTER_SANDBOX_LEASE_RENEW_INTERVAL_SECONDS: ${CODEX_ADAPTER_SANDBOX_LEASE_RENEW_INTERVAL_SECONDS:-30}
      CODEX_ADAPTER_MCP_APPS_ENABLED: ${CODEX_ADAPTER_MCP_APPS_ENABLED:-true}
      CODEX_ADAPTER_MCP_APPS_PUBLIC_BASE_URL: ${CODEX_ADAPTER_MCP_APPS_PUBLIC_BASE_URL:-http://127.0.0.1:3000/api/codex-adapter}
      CODEX_ADAPTER_MCP_APPS_ALLOWED_ORIGINS: ${CODEX_ADAPTER_MCP_APPS_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      CODEX_ADAPTER_MCP_APPS_INTERACTION_TIMEOUT_SECONDS: ${CODEX_ADAPTER_MCP_APPS_INTERACTION_TIMEOUT_SECONDS:-3600}
      CODEX_ADAPTER_MCP_APPS_EVENT_KEEPALIVE_SECONDS: ${CODEX_ADAPTER_MCP_APPS_EVENT_KEEPALIVE_SECONDS:-15}
      CODEX_ADAPTER_MCP_APPS_MAX_EVENT_HISTORY: ${CODEX_ADAPTER_MCP_APPS_MAX_EVENT_HISTORY:-512}
      CODEX_ADAPTER_MCP_APPS_RESOURCE_MAX_BYTES: ${CODEX_ADAPTER_MCP_APPS_RESOURCE_MAX_BYTES:-4194304}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      sandbox-manager:
        condition: service_healthy
    networks:
      - control
      - agent-rpc

  sandbox-manager:
    <<: *common-runtime
    build:
      context: .
      dockerfile: deploy/sandbox-manager/Dockerfile
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: ${AGENT_SANDBOX_MANAGER_IMAGE:-agent-sandbox-manager:0.3.0}
    restart: unless-stopped
    group_add:
      - ${DOCKER_GID:?set DOCKER_GID to the Docker socket group id}
    environment:
      DOCKER_HOST: unix:///run/sandbox-engine/docker.sock
      SANDBOX_MANAGER_HOST: 0.0.0.0
      SANDBOX_MANAGER_PORT: "8092"
      SANDBOX_MANAGER_API_KEY: ${SANDBOX_MANAGER_API_KEY:?set SANDBOX_MANAGER_API_KEY}
      SANDBOX_MANAGER_WORKER_TOKEN_SECRET: ${SANDBOX_MANAGER_WORKER_TOKEN_SECRET:?set SANDBOX_MANAGER_WORKER_TOKEN_SECRET}
      SANDBOX_MANAGER_OPERATION_SIGNING_SECRET: ${SANDBOX_MANAGER_OPERATION_SIGNING_SECRET:?set SANDBOX_MANAGER_OPERATION_SIGNING_SECRET}
      SANDBOX_MANAGER_STATE_DB_PATH: /var/lib/sandbox-manager/state.db
      SANDBOX_MANAGER_WORKSPACE_DELETE_GRACE_SECONDS: ${SANDBOX_MANAGER_WORKSPACE_DELETE_GRACE_SECONDS:-604800}
      SANDBOX_MANAGER_WORKSPACE_LOCAL_RETENTION_SECONDS: ${SANDBOX_MANAGER_WORKSPACE_LOCAL_RETENTION_SECONDS:-86400}
      SANDBOX_MANAGER_STORAGE_ENABLED: ${SANDBOX_MANAGER_STORAGE_ENABLED:-false}
      AGENT_STORAGE_OPS_IMAGE: ${AGENT_STORAGE_OPS_IMAGE:-agent-storage-ops:0.3.0}
      SANDBOX_MANAGER_OPERATION_RUNTIME: runc
      SANDBOX_MANAGER_STORAGE_NETWORK: ${SANDBOX_MANAGER_STORAGE_NETWORK:-agent-storage}
      SANDBOX_MANAGER_STORAGE_TASK_TIMEOUT_SECONDS: ${SANDBOX_MANAGER_STORAGE_TASK_TIMEOUT_SECONDS:-1800}
      SANDBOX_MANAGER_OBJECT_STORE_ENDPOINT: ${RUSTFS_ENDPOINT:-}
      SANDBOX_MANAGER_OBJECT_STORE_REGION: ${RUSTFS_REGION:-us-east-1}
      SANDBOX_MANAGER_OBJECT_STORE_CREDENTIAL_MODE: ${WORKSPACE_S3_CREDENTIAL_MODE:-sts}
      SANDBOX_MANAGER_OBJECT_STORE_PARENT_ACCESS_KEY: ${WORKSPACE_S3_PARENT_ACCESS_KEY:-}
      SANDBOX_MANAGER_OBJECT_STORE_PARENT_SECRET_KEY: ${WORKSPACE_S3_PARENT_SECRET_KEY:-}
      SANDBOX_MANAGER_WORKSPACE_BUCKET: ${WORKSPACE_S3_BUCKET:-agent-data}
      SANDBOX_MANAGER_WORKSPACE_PREFIX: ${WORKSPACE_S3_PREFIX:-workspaces}
      SANDBOX_MANAGER_ARTIFACT_TRANSFER_BASE_URL: http://artifact-service:8093/v1/transfers
      SANDBOX_MANAGER_PUBLISH_SPOOL_VOLUME: ${SANDBOX_MANAGER_PUBLISH_SPOOL_VOLUME:-agent-publish-spool}
      SANDBOX_MANAGER_STS_DURATION_SECONDS: ${SANDBOX_MANAGER_STS_DURATION_SECONDS:-1800}
      SANDBOX_MANAGER_RESTIC_PASSWORD_FILE: ${SANDBOX_MANAGER_RESTIC_PASSWORD_FILE:-}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-codex-sandbox-worker:0.3.0}
      SANDBOX_MANAGER_DOCKER_RUNTIME: ${SANDBOX_MANAGER_DOCKER_RUNTIME:-runsc}
      SANDBOX_MANAGER_RPC_NETWORK: ${SANDBOX_MANAGER_RPC_NETWORK:-agent-rpc}
      SANDBOX_MANAGER_EGRESS_NETWORK: ${SANDBOX_MANAGER_EGRESS_NETWORK:-agent-egress}
      SANDBOX_MANAGER_RESOLV_CONF_FILE: ${SANDBOX_MANAGER_RESOLV_CONF_FILE:?set SANDBOX_MANAGER_RESOLV_CONF_FILE}
      SANDBOX_MANAGER_EGRESS_PROXY_URL: ${SANDBOX_MANAGER_EGRESS_PROXY_URL:-http://egress-proxy:3128}
      SANDBOX_MANAGER_INTERNAL_NO_PROXY: ${SANDBOX_MANAGER_INTERNAL_NO_PROXY:-}
      SANDBOX_MANAGER_WORKER_PORT: ${SANDBOX_MANAGER_WORKER_PORT:-8091}
      SANDBOX_MANAGER_EXECUTION_TTL_SECONDS: ${SANDBOX_MANAGER_EXECUTION_TTL_SECONDS:-1800}
      SANDBOX_MANAGER_REAPER_INTERVAL_SECONDS: ${SANDBOX_MANAGER_REAPER_INTERVAL_SECONDS:-15}
      SANDBOX_MANAGER_MEMORY_LIMIT: ${SANDBOX_MANAGER_MEMORY_LIMIT:-4g}
      SANDBOX_MANAGER_NANO_CPUS: ${SANDBOX_MANAGER_NANO_CPUS:-2000000000}
      SANDBOX_MANAGER_PIDS_LIMIT: ${SANDBOX_MANAGER_PIDS_LIMIT:-512}
      SANDBOX_MANAGER_TMPFS_LIMIT: ${SANDBOX_MANAGER_TMPFS_LIMIT:-256m}
      SANDBOX_MANAGER_CODEX_COMMAND: ${SANDBOX_MANAGER_CODEX_COMMAND:-codex app-server --stdio}
      SANDBOX_MANAGER_CODEX_MODEL: ${SANDBOX_MANAGER_CODEX_MODEL:-}
      SANDBOX_MANAGER_CODEX_AUTH_FILE: ${SANDBOX_MANAGER_CODEX_AUTH_FILE:?set SANDBOX_MANAGER_CODEX_AUTH_FILE}
      SANDBOX_MANAGER_CODEX_CONFIG_FILE: ${SANDBOX_MANAGER_CODEX_CONFIG_FILE:-}
      SANDBOX_MANAGER_MCP_APPS_ENABLED: ${CODEX_ADAPTER_MCP_APPS_ENABLED:-true}
    volumes:
      - ${SANDBOX_MANAGER_DOCKER_SOCKET:-/var/run/docker.sock}:/run/sandbox-engine/docker.sock
      - sandbox-manager-state:/var/lib/sandbox-manager
      - publish-spool:/var/lib/sandbox-manager/publish-spool
      - ${SANDBOX_MANAGER_SECRET_DIR:?set SANDBOX_MANAGER_SECRET_DIR}:${SANDBOX_MANAGER_SECRET_DIR:?set SANDBOX_MANAGER_SECRET_DIR}:ro
      - ${SANDBOX_MANAGER_RESOLV_CONF_FILE:?set SANDBOX_MANAGER_RESOLV_CONF_FILE}:${SANDBOX_MANAGER_RESOLV_CONF_FILE:?set SANDBOX_MANAGER_RESOLV_CONF_FILE}:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/healthz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - control
      - storage

networks:
  control:
    external: true
    name: ${CONTROL_NETWORK:-agent-control}
  agent-rpc:
    external: true
    name: ${SANDBOX_MANAGER_RPC_NETWORK:-agent-rpc}
  storage:
    external: true
    name: ${SANDBOX_MANAGER_STORAGE_NETWORK:-agent-storage}

volumes:
  open-webui-data:
    name: ${OPEN_WEBUI_DATA_VOLUME:-open-webui-data}
  sandbox-manager-state:
    name: ${SANDBOX_MANAGER_STATE_VOLUME:-sandbox-manager-state}
  publish-spool:
    name: ${SANDBOX_MANAGER_PUBLISH_SPOOL_VOLUME:-agent-publish-spool}
